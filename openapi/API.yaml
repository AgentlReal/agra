  /api/v1/learning/levels/{level_id}/attempts:
    post:
      operationId: startLevelAttempt
      summary: Memulai sesi latihan level kognitif baru atau melanjutkan sesi aktif
      description: 'Memulai sesi latihan 10 butir soal untuk level kognitif terkait (L1/L2/L3).

        Validasi sistem:

        1. Siswa telah lulus Recall Kemampuanmu.

        2. Prasyarat sekuensial level terpenuhi (L1 terbuka default jika submateri aktif; L2 terbuka jika L1 COMPLETED;
        L3 terbuka jika L2 COMPLETED).

        3. Menarik 10 butir soal dari Bank Soal Latihan menggunakan algoritma Unseen-First (prioritas belum pernah
        dikerjakan) dan rotasi LRU jika stok belum dikerjakan < 10 butir.

        4. Jika terdapat sesi aktif (IN_PROGRESS), sistem mengembalikan sesi tersebut (resume idempotensi) dengan
        status 200 OK. Jika sesi baru dibuat, sistem mengembalikan 201 Created.


        Server memvalidasi sesi, memastikan users.role=SISWA, dan memeriksa kepemilikan data siswa jika operasi
        memakai ID attempt/progres. Klien tidak menentukan hak akses. Akun SISWA yang belum memilih kelas dan belum
        memiliki user_profiles menerima 409; selesaikan POST /api/v1/profile/complete terlebih dahulu.'
      tags:
      - Latihan Level Kognitif
      parameters:
      - name: level_id
        in: path
        required: true
        description: Identifier tingkat level kognitif (cognitive_levels.id)
        schema:
          type: integer
          format: int32
          example: 1
      responses:
        '201':
          description: Sesi latihan baru berhasil diinisialisasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M04_LevelSessionDetail'
        '200':
          description: Mengembalikan sesi latihan aktif yang belum selesai (Resume Session)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M04_LevelSessionDetail'
        '400':
          $ref: '#/components/responses/M04_BadRequest'
        '401':
          $ref: '#/components/responses/M04_Unauthorized'
        '403':
          description: PREREQUISITE_LOCKED - Level kognitif sebelumnya belum tuntas atau materi masih terkunci
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M04_ErrorResponse'
        '404':
          description: Level kognitif atau submateri tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M04_ErrorResponse'
        '409':
          description: Akun SISWA yang belum memilih kelas dan belum memiliki user_profiles menerima 409; selesaikan
            POST /api/v1/profile/complete terlebih dahulu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M04_ErrorResponse'
              example:
                status: 409
                error: PROFILE_INCOMPLETE
                message: Lengkapi profil siswa dengan memilih kelas terlebih dahulu.
      security:
      - BetterAuthSessionCookie: []
      - BetterAuthSecureSessionCookie: []
      x-required-role: SISWA
