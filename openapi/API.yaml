openapi: 3.0.3
info:
  title: Kontrak API Platform TKA Murid dan Tim Kurikulum
  version: 1.9.2
  description: Registrasi siswa menerima email, username, dan password; users.name otomatis string kosong. Setelah
    login, siswa memilih kelas untuk membuat user_profiles dengan avatar default. Identitas siswa dan Tim Kurikulum
    berada di users. Login memakai endpoint email atau username Better Auth. Sesi memakai cookie dengan aturan satu
    perangkat dan penguncian 15 menit setelah lima kegagalan berturut-turut.
servers:
- url: /
tags:
- name: Auth Murid & Kurikulum
  description: UCS-01 & UCS-07 - registrasi, autentikasi, pemulihan password, sesi, dan logout.
- name: Profil Siswa
  description: UCS-06 - profil, avatar preset, password, XP, dan Share Profile.
- name: Dashboard Siswa
  description: UCS-08 - progres kompetensi dan rekomendasi tindakan belajar berikutnya.
- name: Recall Kemampuanmu
  description: UCS-02 - sesi asesmen pembuka 30 soal lintas mata pelajaran, autosave, submit, hasil, dan pembahasan.
- name: Kurikulum Siswa
  description: UCS-03 - daftar mata pelajaran, struktur materi dan level, serta progres submateri siswa.
- name: Latihan Level Kognitif
  description: Siklus pengerjaan latihan level kognitif mandiri siswa (UCS-04, FR F46-F68, F86)
- name: Simulasi TKA
  description: Asesmen puncak capstone per mata pelajaran (UCS-05, FR F69-F85, F86)
- name: Auth Tim Kurikulum
  description: UCS-01 - Login, logout, dan sesi aktif akun Tim Kurikulum.
- name: Profil Tim Kurikulum
  description: UCS-09 - Mengelola profil dan password akun Tim Kurikulum yang sedang login.
- name: Bank Soal
  description: 'UCS-10 - Mengelola 3 bank soal beserta soal-soal di dalamnya, termasuk pencarian/filter,

    upload gambar pendukung soal, dan monitoring stok/kecukupan soal.

    '
- name: Paket Simulasi
  description: UCS-11 - Mengelola paket simulasi TKA (susunan 30 soal) beserta publish/nonaktifkan dan statistik
    pesertanya.
- name: Classical Test Theory (CTT)
  description: UCS-12 - Analisis statistik tingkat kesukaran soal (p-value) dan pencatatan hasil review Tim Kurikulum.
paths:
  /api/auth/sign-up/student:
    post:
      tags:
      - Auth Murid & Kurikulum
      operationId: signUpStudent
      summary: Registrasi akun siswa melalui plugin Better Auth
      description: Endpoint plugin Better Auth khusus siswa. Form hanya meminta email, username permanen, dan password.
        Server otomatis mengisi users.id, users.name="", users.emailVerified=false, users.createdAt, users.updatedAt,
        users.role=SISWA, dan users.image=NULL; users.email/username berasal dari input. Plugin mengirim name=""
        secara internal ke proses pembuatan user Better Auth, membuat akun credential, lalu membuat sesi. user_profiles
        belum dibuat pada tahap ini karena grade belum dipilih. Pengguna melanjutkan dengan POST /api/v1/profile/complete
        untuk memilih kelas dan membuat profil siswa. Konfirmasi password dicocokkan pada formulir, bukan dikirim
        ke API.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              - username
              - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                  description: users.email unik
                username:
                  type: string
                  minLength: 3
                  maxLength: 16
                  pattern: ^[a-z0-9_]{3,16}$
                  description: users.username unik lintas peran dan permanen; divalidasi plugin username Better
                    Auth.
                password:
                  $ref: '#/components/schemas/M01_06_07_08_NewPassword'
            example:
              email: user@example.com
              username: user
              password: Belajar1!
      responses:
        '200':
          description: Akun siswa dan sesi Better Auth dibuat; user_profiles belum ada sampai kelas dipilih.
          content:
            application/json:
              schema:
                type: object
                required:
                - user
                - token
                properties:
                  token:
                    type: string
                    description: Token sesi dari Better Auth setelah autoSignIn; browser mengirim cookie HttpOnly
                      untuk permintaan selanjutnya.
                  user:
                    type: object
                    required:
                    - id
                    - name
                    - username
                    - email
                    - role
                    properties:
                      id:
                        type: string
                        description: users.id
                      username:
                        type: string
                        description: users.username; permanen setelah registrasi.
                      name:
                        type: string
                        description: users.name; string kosong saat akun dibuat, dapat diisi melalui pembaruan profil.
                      email:
                        type: string
                        format: email
                        description: users.email
                      role:
                        type: string
                        enum:
                        - SISWA
                        description: Registrasi publik menghasilkan users.role=SISWA; ditetapkan server.
        '400':
          description: Input registrasi ditolak plugin Better Auth; bentuk error mengikuti code/message Better Auth.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '422':
          description: Email atau username telah digunakan, atau nilai akun tidak valid; bentuk error plugin mengikuti
            Better Auth (code/message).
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
      x-better-auth:
        mode: custom-plugin
        nativeAction: create student credential and session with Better Auth internals
        profileTable: user_profiles
        notes: Bukan sign-up/email bawaan; endpoint bawaan harus dinonaktifkan untuk mencegah akun tanpa profil.
  /api/auth/sign-in/email:
    post:
      tags:
      - Auth Murid & Kurikulum
      - Auth Tim Kurikulum
      operationId: signInEmail
      summary: Login email/password bawaan Better Auth
      description: Login siswa dan Tim Kurikulum dengan email/password bawaan Better Auth. Form identitas tunggal
        mengirim ke endpoint ini jika input mengandung @; selain itu memakai /api/auth/sign-in/username. Setelah
        login berhasil, server mencabut sesi lama akun yang sama. Lima kegagalan kredensial berturut-turut untuk
        akun yang sama, dari kedua endpoint login, mengunci login 15 menit. Server memeriksa users.role pada resource
        aplikasi.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  description: users.email untuk SISWA maupun TIM_KURIKULUM
                password:
                  type: string
                  format: password
                rememberMe:
                  type: boolean
                  description: Opsi bawaan Better Auth; bila false sesi berakhir saat browser ditutup.
                callbackURL:
                  type: string
                  description: URL callback opsional Better Auth
            example:
              email: user@example.com
              password: Belajar1!
      responses:
        '200':
          description: Sesi Better Auth berhasil dibuat untuk siswa atau Tim Kurikulum.
          content:
            application/json:
              schema:
                type: object
                required:
                - redirect
                - token
                - user
                properties:
                  redirect:
                    type: boolean
                  token:
                    type: string
                    description: Token sesi dalam respons bawaan Better Auth; autentikasi web berikutnya menggunakan
                      cookie HttpOnly yang dikelola Better Auth.
                  url:
                    type: string
                    nullable: true
                  user:
                    type: object
                    required:
                    - id
                    - name
                    - username
                    - email
                    - role
                    properties:
                      id:
                        type: string
                        description: users.id
                      username:
                        type: string
                        description: users.username; identitas unik permanen.
                      name:
                        type: string
                        description: users.name; awalnya string kosong dan dapat diubah pada profil.
                      email:
                        type: string
                        format: email
                        description: users.email
                      role:
                        type: string
                        enum:
                        - SISWA
                        - TIM_KURIKULUM
                        description: users.role; ditetapkan server, bukan input login
        '400':
          description: Kesalahan dari endpoint Better Auth.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '401':
          description: Kesalahan dari endpoint Better Auth.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '429':
          description: Terlalu banyak percobaan atau login terkunci 15 menit setelah lima kegagalan berturut-turut.
            Pesan tidak mengungkap apakah identitas terdaftar.
          headers:
            X-Retry-After:
              description: Jumlah detik hingga percobaan berikutnya diizinkan.
              schema:
                type: integer
                minimum: 1
                example: 900
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    example: LOGIN_TEMPORARILY_LOCKED
                  message:
                    type: string
                    example: Terlalu banyak percobaan login. Silakan coba lagi nanti.
      x-better-auth:
        mode: native
        nativeAction: auth.api.signInEmail
  /api/auth/sign-in/username:
    post:
      tags:
      - Auth Murid & Kurikulum
      - Auth Tim Kurikulum
      operationId: signInUsername
      summary: Login username/password plugin bawaan Better Auth
      description: Login siswa dan Tim Kurikulum dengan plugin username bawaan Better Auth. Form identitas tunggal
        mengirim ke endpoint ini jika input tidak mengandung @; email memakai /api/auth/sign-in/email. Tidak ada
        parameter role dari klien; server memeriksa users.role pada resource aplikasi. Kebijakan satu sesi aktif
        dan lima kegagalan berturut-turut/15 menit berlaku bersama dengan login email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - username
              - password
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 16
                  pattern: ^[a-z0-9_]{3,16}$
                  description: users.username unik lintas peran.
                password:
                  type: string
                  format: password
                  writeOnly: true
            example:
              username: user
              password: Belajar1!
      responses:
        '200':
          description: Sesi Better Auth berhasil dibuat untuk siswa atau Tim Kurikulum.
          content:
            application/json:
              schema:
                type: object
                required:
                - redirect
                - token
                - user
                properties:
                  redirect:
                    type: boolean
                  token:
                    type: string
                    description: Token sesi dalam respons bawaan Better Auth; autentikasi web berikutnya menggunakan
                      cookie HttpOnly yang dikelola Better Auth.
                  url:
                    type: string
                    nullable: true
                  user:
                    type: object
                    required:
                    - id
                    - name
                    - username
                    - email
                    - role
                    properties:
                      id:
                        type: string
                        description: users.id
                      username:
                        type: string
                        description: users.username; identitas unik permanen.
                      name:
                        type: string
                        description: users.name; awalnya string kosong dan dapat diubah pada profil.
                      email:
                        type: string
                        format: email
                        description: users.email
                      role:
                        type: string
                        enum:
                        - SISWA
                        - TIM_KURIKULUM
                        description: users.role; ditetapkan server, bukan input login
        '400':
          description: Kesalahan dari endpoint Better Auth.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '401':
          description: Kesalahan dari endpoint Better Auth.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '429':
          description: Terlalu banyak percobaan atau login terkunci 15 menit setelah lima kegagalan berturut-turut.
            Pesan tidak mengungkap apakah identitas terdaftar.
          headers:
            X-Retry-After:
              description: Jumlah detik hingga percobaan berikutnya diizinkan.
              schema:
                type: integer
                minimum: 1
                example: 900
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    example: LOGIN_TEMPORARILY_LOCKED
                  message:
                    type: string
                    example: Terlalu banyak percobaan login. Silakan coba lagi nanti.
      x-better-auth:
        mode: native-plugin
        nativeAction: auth.api.signInUsername
        plugin: username
  /api/auth/sign-out:
    post:
      tags:
      - Auth Murid & Kurikulum
      - Auth Tim Kurikulum
      operationId: signOut
      summary: Keluar dari sesi Better Auth
      description: Endpoint bawaan Better Auth membatalkan sesi aktif berdasarkan cookie sesi yang dikirim browser.
      responses:
        '200':
          description: Sesi dibatalkan oleh Better Auth.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          description: Sesi tidak valid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
      security:
      - BetterAuthSessionCookie: []
      - BetterAuthSecureSessionCookie: []
      x-better-auth:
        mode: native
        nativeAction: auth.api.signOut
  /api/auth/get-session:
    get:
      tags:
      - Auth Murid & Kurikulum
      - Auth Tim Kurikulum
      operationId: getSession
      summary: Mengambil sesi Better Auth
      description: Endpoint bawaan Better Auth; cookie sesi diproses bila tersedia. Tanpa sesi aktif respons 200
        berisi null; pengguna yang login menerima user dan session. Profil aplikasi diambil melalui endpoint profil
        sesuai role.
      security: []
      responses:
        '200':
          description: Sesi aktif atau null bila belum terautentikasi.
          content:
            application/json:
              schema:
                nullable: true
                type: object
                required:
                - user
                - session
                properties:
                  user:
                    type: object
                    required:
                    - id
                    - name
                    - username
                    - email
                    - role
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                        description: users.name; dapat berupa string kosong sebelum diisi.
                      email:
                        type: string
                        format: email
                      role:
                        type: string
                        enum:
                        - SISWA
                        - TIM_KURIKULUM
                      username:
                        type: string
                        description: users.username; permanen.
                  session:
                    type: object
                    required:
                    - id
                    - userId
                    - expiresAt
                    properties:
                      id:
                        type: string
                      userId:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
      x-better-auth:
        mode: native
        nativeAction: auth.api.getSession
  /api/auth/request-password-reset:
    post:
      tags:
      - Auth Murid & Kurikulum
      - Auth Tim Kurikulum
      operationId: requestPasswordReset
      summary: Meminta tautan reset password
      description: Endpoint bawaan Better Auth dengan sendResetPassword. Pesan antarmuka tetap generik untuk email
        terdaftar/tidak. Klien dapat menyediakan redirectTo yang divalidasi trustedOrigins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                redirectTo:
                  type: string
                  format: uri
                  description: URL tujuan dari tautan reset; opsional.
      responses:
        '200':
          description: Permintaan diterima.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: boolean
                    example: true
        '400':
          description: Email atau URL tujuan tidak valid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
      security: []
      x-better-auth:
        mode: native
        nativeAction: auth.api.requestPasswordReset
  /api/auth/reset-password:
    post:
      tags:
      - Auth Murid & Kurikulum
      - Auth Tim Kurikulum
      operationId: resetPassword
      summary: Reset password dengan token
      description: Endpoint bawaan Better Auth menerima token dan newPassword. Validasi konfirmasi password berlangsung
        di formulir klien sebelum request; kebijakan panjang dan kompleksitas wajib ditegakkan server lewat konfigurasi/hook
        Better Auth. Token sekali pakai disimpan di verifications.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - newPassword
              properties:
                token:
                  type: string
                  minLength: 1
                  writeOnly: true
                newPassword:
                  $ref: '#/components/schemas/M01_06_07_08_NewPassword'
      responses:
        '200':
          description: Password berhasil direset.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: boolean
                    example: true
        '400':
          description: Token kedaluwarsa/tidak sah atau password tidak memenuhi kebijakan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
      security: []
      x-better-auth:
        mode: native
        nativeAction: auth.api.resetPassword
  /api/auth/change-password:
    post:
      tags:
      - Auth Murid & Kurikulum
      - Auth Tim Kurikulum
      operationId: changePassword
      summary: Mengganti password akun aktif
      description: Endpoint bawaan Better Auth untuk kedua role. Klien menyamakan konfirmasi sebelum memanggil endpoint.
        Server menegakkan kebijakan password 6–12 karakter, kompleksitas, dan sesi aktif. Sesi dikenali melalui
        cookie Better Auth bawaan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - currentPassword
              - newPassword
              properties:
                currentPassword:
                  type: string
                  format: password
                  writeOnly: true
                newPassword:
                  $ref: '#/components/schemas/M01_06_07_08_NewPassword'
                revokeOtherSessions:
                  type: boolean
                  description: Opsi Better Auth; true membatalkan sesi lain.
      responses:
        '200':
          description: Password berhasil diganti.
          content:
            application/json:
              schema:
                type: object
                description: Respons asli Better Auth setelah perubahan password; konten sesi mengikuti konfigurasi
                  Better Auth.
                properties:
                  token:
                    type: string
                    description: Token sesi aktif bila dikembalikan konfigurasi Better Auth.
        '400':
          description: Password lama salah atau password baru tidak memenuhi kebijakan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
        '401':
          description: Sesi tidak valid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
      security:
      - BetterAuthSessionCookie: []
      - BetterAuthSecureSessionCookie: []
      x-better-auth:
        mode: native
        nativeAction: auth.api.changePassword
  /api/v1/profile:
    get:
      tags:
      - Profil Siswa
      operationId: getStudentProfile
      summary: Mengambil profil siswa
      description: Mengembalikan users.name sebagai nama tampilan (dapat berupa string kosong sebelum diisi), users.username
        permanen, email, avatar preset, total XP, milestone, dan progres milestone. Server memvalidasi sesi dan
        users.role=SISWA. Akun SISWA yang belum memilih kelas dan belum memiliki user_profiles menerima 409; selesaikan
        POST /api/v1/profile/complete terlebih dahulu.
      x-ucs:
      - UCS-06
      x-fr:
      - F16
      - F86
      - F87
      - F90
      security:
      - BetterAuthSessionCookie: []
      - BetterAuthSecureSessionCookie: []
      responses:
        '200':
          description: Profil berhasil diambil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M01_06_07_08_StudentProfileResponse'
        '401':
          $ref: '#/components/responses/M01_06_07_08_Unauthorized'
        '403':
          description: Sesi valid, tetapi users.role bukan SISWA atau akses ke data siswa ini ditolak.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M01_06_07_08_ErrorResponse'
              example:
                success: false
                error:
                  code: FORBIDDEN
                  message: Akses ke resource ini ditolak.
        '409':
          description: Akun SISWA yang belum memilih kelas dan belum memiliki user_profiles menerima 409; selesaikan
            POST /api/v1/profile/complete terlebih dahulu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M01_06_07_08_ErrorResponse'
              example:
                success: false
                error:
                  code: PROFILE_INCOMPLETE
                  message: Lengkapi profil siswa dengan memilih kelas terlebih dahulu.
      x-required-role: SISWA
    patch:
      tags:
      - Profil Siswa
      operationId: updateStudentProfile
      summary: Mengubah nama tampilan siswa
      description: Memperbarui users.name (3-30 karakter) untuk siswa. users.username permanen dan tidak menerima
        perubahan melalui endpoint ini. Server memvalidasi sesi dan users.role=SISWA. Akun SISWA yang belum memilih
        kelas dan belum memiliki user_profiles menerima 409; selesaikan POST /api/v1/profile/complete terlebih dahulu.
      x-ucs:
      - UCS-06
      x-fr:
      - F17
      security:
      - BetterAuthSessionCookie: []
      - BetterAuthSecureSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/M01_06_07_08_UpdateProfileRequest'
            example:
              name: User
      responses:
        '200':
          description: Profil berhasil diperbarui.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M01_06_07_08_StudentProfileResponse'
        '401':
          $ref: '#/components/responses/M01_06_07_08_Unauthorized'
        '422':
          description: users.name gagal validasi pada pembaruan profil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M01_06_07_08_ErrorResponse'
              example:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: Data yang dikirim tidak valid.
                  fields:
                    name: Nama tampilan harus terdiri dari 3-30 karakter.
        '403':
          description: Sesi valid, tetapi users.role bukan SISWA atau akses ke data siswa ini ditolak.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M01_06_07_08_ErrorResponse'
              example:
                success: false
                error:
                  code: FORBIDDEN
                  message: Akses ke resource ini ditolak.
        '409':
          description: Akun SISWA yang belum memilih kelas dan belum memiliki user_profiles menerima 409; selesaikan
            POST /api/v1/profile/complete terlebih dahulu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M01_06_07_08_ErrorResponse'
              example:
                success: false
                error:
                  code: PROFILE_INCOMPLETE
                  message: Lengkapi profil siswa dengan memilih kelas terlebih dahulu.
      x-required-role: SISWA
  /api/v1/profile/complete:
    post:
      tags:
      - Profil Siswa
      operationId: completeStudentProfile
      summary: Memilih kelas dan membuat profil siswa
      description: Langkah setelah registrasi atau login pertama untuk akun SISWA tanpa user_profiles. Server memvalidasi
        role, memilih preset avatar default aktif dan milestone awal, lalu secara atomik membuat user_profiles dengan
        grade, preset_avatar_id, current_milestone_tier_id, total_xp=0, dan is_recall_passed=false. users.name tetap
        string kosong. Hanya satu profil per users.id; jika profil sudah ada, respons 409 tanpa mengubahnya. Bila
