      summary: Finalisasi dan evaluasi pengerjaan latihan 10 butir soal
      description: "Mengirimkan lembar jawaban akhir untuk dinilai secara otomatis oleh server:\n1. Menghitung jumlah\
        \ jawaban benar (0-10) dengan aturan biner MCMA All-or-Nothing.\n2. Mengevaluasi kriteria kelulusan level:\
