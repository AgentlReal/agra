  schemas:
    M01_06_07_08_NewPassword:
      type: string
      format: password
      minLength: 6
      maxLength: 12
      pattern: ^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{6,12}$
      writeOnly: true
      description: '6–12 karakter: minimal satu huruf besar, satu huruf kecil, satu angka, dan satu karakter khusus
        (keputusan Dokumen Kurikulum 7 dan UCS-01).'
    M01_06_07_08_UpdateProfileRequest:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 30
